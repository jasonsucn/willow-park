<!doctype html><html lang="en"><meta charset="utf-8"><title>Willow Park browser verification</title><style>body{margin:0;background:#18251f;color:#e9f0e4;font:13px/1.6 monospace}header{padding:12px 20px;display:flex;gap:15px;align-items:center;flex-wrap:wrap}button{padding:8px 12px;cursor:pointer}#report{white-space:pre-wrap;padding:12px 20px}iframe{display:block;border:0;width:100vw;height:80vh}iframe.mobile{width:390px;height:844px}details{padding:10px 20px}#errors{color:#ffb5a6}</style><header><strong>WILLOW PARK · LIVE QA</strong><button id="inspect">Inspect state</button><button id="mobile">Mobile 390 × 844</button><button id="desktop">Desktop</button><button id="ripple">Click water at projected point</button><button id="exercise">Check views and lighting</button><button id="audio">Test audio lifecycle</button><button id="measure">Measure 3 second frame rate</button></header><div id="report">Loading</div><details open><summary>Browser errors</summary><pre id="errors">None</pre></details><iframe id="park" title="Park under test"></iframe><script>
const errors=[];const f=document.getElementById('park'),report=document.getElementById('report');
window.addEventListener('message',e=>{if(e.data&&e.data.parkError){errors.push(e.data.parkError);document.getElementById('errors').textContent=errors.join('\n');}});
fetch('index.html').then(r=>r.text()).then(html=>{f.srcdoc=html.replace('<head>','<head><base href="./"><script>window.addEventListener("error",e=>parent.postMessage({parkError:e.message},"*"));const originalError=console.error;console.error=(...args)=>{parent.postMessage({parkError:args.map(a=>String(a)).join(" ")},"*");originalError.apply(console,args)};<\/script>');});
function inspect(){const w=f.contentWindow,p=w.ParkScene;if(!p){report.textContent='Scene not ready. '+(w.ParkBootError||'');return;}const doc=w.document;const overflow=[];doc.querySelectorAll('header, .intro, .control-dock, .sound-invitation, .sound-popover, .discovery-panel').forEach(el=>{if(el.hidden)return;const r=el.getBoundingClientRect();if(r.left<0||r.right>w.innerWidth+1||r.bottom>w.innerHeight+1)overflow.push(el.className);});report.textContent=JSON.stringify({ready:doc.getElementById('experience').dataset.ready,viewport:[w.innerWidth,w.innerHeight],webgl:p.renderer.capabilities.isWebGL2?'WebGL2':'WebGL1',device:w.ParkGraphicsDevice,pixelRatio:p.renderer.getPixelRatio(),largestGeometry:(()=>{const a=[];p.scene.traverse(o=>{if(o.isMesh&&o.layers.mask!==-2147483648&&o.visible)a.push({name:o.name||o.geometry.type,tri:(o.geometry.index?o.geometry.index.count:o.geometry.attributes.position.count)/3*(o.count||1),instances:o.count||1})});return a.sort((x,y)=>y.tri-x.tri).slice(0,8)})(),...p.getStats(),staticDrawCallsSaved:w.ParkStaticBatches,ui:w.ParkUI.state,audio:w.ParkUI.getAudio()?{enabled:w.ParkUI.getAudio().enabled,state:w.ParkUI.getAudio()._context?.state}:null,overflow,shaderErrors:errors.length},null,2);}
document.getElementById('inspect').onclick=inspect;document.getElementById('mobile').onclick=()=>{f.className='mobile';setTimeout(inspect,1500)};document.getElementById('desktop').onclick=()=>{f.className='';setTimeout(inspect,1500)};
document.getElementById('ripple').onclick=()=>{const w=f.contentWindow,p=w.ParkScene,v=new w.THREE.Vector3(7,.2,0).project(p.camera),x=(v.x+1)/2*w.innerWidth,y=(-v.y+1)/2*w.innerHeight,c=p.renderer.domElement;c.dispatchEvent(new w.PointerEvent('pointerdown',{clientX:x,clientY:y,pointerId:100,bubbles:true}));c.dispatchEvent(new w.PointerEvent('pointerup',{clientX:x,clientY:y,pointerId:100,bubbles:true}));setTimeout(inspect,80);};
document.getElementById('exercise').onclick=async()=>{const w=f.contentWindow;for(const view of ['pavilion','dog','garden','overview']){w.ParkUI.selectView(view);await new Promise(r=>setTimeout(r,2600));}const slider=w.document.getElementById('time-slider');slider.value=100;slider.dispatchEvent(new w.Event('input',{bubbles:true}));await new Promise(r=>setTimeout(r,2200));inspect();};
document.getElementById('audio').onclick=async()=>{const w=f.contentWindow,b=w.document.getElementById('sound-toggle');b.click();await new Promise(r=>setTimeout(r,1500));inspect();};
document.getElementById('measure').onclick=()=>{let n=0,start=performance.now();const loop=()=>{n++;if(performance.now()-start<3000)requestAnimationFrame(loop);else{inspect();report.textContent+='\nAnimation callbacks per second: '+(n/((performance.now()-start)/1000)).toFixed(1)}};requestAnimationFrame(loop)};
setTimeout(inspect,6500);
</script></html>
